<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-localize="__MSG_changelogTitle__">Changelog - SideTimeTable</title>
    <!-- Font Awesome -->
    <link href="https://use.fontawesome.com/releases/v6.7.1/css/all.css" rel="stylesheet">
    <script src="../lib/localize.js"></script>
    <link rel="stylesheet" href="../options/settings-tokens.css">
    <link rel="stylesheet" href="changelog.css">
    <script src="../../dist/changelog.bundle.js"></script>
</head>
<body style="opacity: 0;">

<div class="changelog-page">
    <header class="changelog-header">
        <span class="changelog-app-mark" aria-hidden="true"><i class="fas fa-calendar-day"></i></span>
        <div class="changelog-heading">
            <h1 class="changelog-title" data-localize="__MSG_changelogTitle__">Changelog</h1>
            <p class="changelog-subtitle" data-localize="__MSG_changelogDescription__">What changed in each version of SideTimeTable</p>
        </div>
    </header>

    <!-- One card; each version is a row: version and date, then what changed -->
    <main class="changelog-card" id="release-notes-container"></main>
</div>

</body>
</html>
