<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-localize="__MSG_optionsTitle__">SideTimeTableの設定</title>
    <!-- Font Awesome -->
    <link href="https://use.fontawesome.com/releases/v6.7.1/css/all.css" rel="stylesheet">
    <script src="../lib/localize.js"></script>
    <link rel="stylesheet" href="settings-tokens.css">
    <link rel="stylesheet" href="options.css">
    <link rel="stylesheet" href="google_button.css">
    <script src="../../dist/options.bundle.js"></script>
</head>
<body style="opacity: 0;">

<div class="settings-page">
    <header class="settings-header">
        <span class="settings-app-mark" aria-hidden="true"><i class="fas fa-calendar-day"></i></span>
        <h1 class="settings-page-title" data-localize="__MSG_optionsTitle__">SideTimeTable settings</h1>
        <span class="settings-version" id="settings-version"></span>
    </header>

    <div class="settings-layout">
        <!-- Sections: a list on the left, a segmented control in a narrow window -->
        <nav class="settings-nav" id="settings-tablist" role="tablist" aria-orientation="vertical">
            <button class="settings-nav-link" id="tab-google-btn" type="button"
                    role="tab" aria-controls="tab-google" aria-selected="true">
                <i class="fas fa-link" aria-hidden="true"></i><span data-localize="__MSG_integration__">Integration</span>
            </button>
            <button class="settings-nav-link" id="tab-display-btn" type="button"
                    role="tab" aria-controls="tab-display" aria-selected="false">
                <i class="fas fa-display" aria-hidden="true"></i><span data-localize="__MSG_displaySettings__">Display</span>
            </button>
            <button class="settings-nav-link" id="tab-general-btn" type="button"
                    role="tab" aria-controls="tab-general" aria-selected="false">
                <i class="fas fa-gear" aria-hidden="true"></i><span data-localize="__MSG_generalSettings__">General</span>
            </button>
            <!-- Developer: shown by JS when enabled -->
            <button class="settings-nav-link" id="tab-developer-btn" type="button" hidden
                    role="tab" aria-controls="tab-developer" aria-selected="false">
                <i class="fas fa-code" aria-hidden="true"></i><span data-localize="__MSG_developerSettingsTab__">Developer</span>
            </button>
        </nav>

        <!-- Tutorial, changelog and reset: under the sections, or at the
             bottom of the page in a narrow window -->
        <div id="control-buttons-container" class="settings-extras"></div>

        <main class="settings-content" id="settings-panels">
            <div class="settings-tab-panel" id="tab-google"
                 role="tabpanel" aria-labelledby="tab-google-btn">
                <h2 class="settings-section-title" data-localize="__MSG_integration__">Integration</h2>
            </div>
            <div class="settings-tab-panel" id="tab-display" hidden
                 role="tabpanel" aria-labelledby="tab-display-btn">
                <h2 class="settings-section-title" data-localize="__MSG_displaySettings__">Display</h2>
            </div>
            <div class="settings-tab-panel" id="tab-general" hidden
                 role="tabpanel" aria-labelledby="tab-general-btn">
                <h2 class="settings-section-title" data-localize="__MSG_generalSettings__">General</h2>
            </div>
            <div class="settings-tab-panel" id="tab-developer" hidden
                 role="tabpanel" aria-labelledby="tab-developer-btn">
                <h2 class="settings-section-title" data-localize="__MSG_developerSettingsTab__">Developer</h2>
            </div>
        </main>
    </div>

    <datalist id="time-list"></datalist>
</div>

</body>
</html>
